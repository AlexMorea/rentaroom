name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django test suite
        env:
          # Throwaway key for CI only - never used for anything real.
          # DATABASE_URL is intentionally unset so settings.py falls back
          # to a local sqlite db, same as running the tests anywhere else.
          SECRET_KEY: ci-only-secret-key-not-for-production-use
        run: python manage.py test

  typecheck:
    name: Pyright (matches editor warnings)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install pyright

      - name: Run pyright
        run: pyright
