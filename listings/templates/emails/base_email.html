<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ subject|default:"Rooms4You" }}</title>

    <style>
      body {
        margin: 0;
        padding: 24px 12px;
        background: #f4f7fb;
        font-family: Inter, Arial, Helvetica, sans-serif;
        color: #0f172a;
      }

      .email-wrapper {
        max-width: 640px;
        margin: 0 auto;
      }

      .email-card {
        background: #ffffff;
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
      }

      .email-header {
        padding: 32px 24px;
        text-align: center;
        background: linear-gradient(135deg, #111827, #1e293b);
      }

      .logo {
        width: 150px;
        max-width: 100%;
      }

      .email-content {
        padding: 40px 32px;
      }

      h1,
      h2,
      h3 {
        margin-top: 0;
        color: #0f172a;
        line-height: 1.2;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 18px;
      }

      h2 {
        font-size: 24px;
        margin-bottom: 18px;
      }

      p {
        margin: 0 0 18px;
        font-size: 15px;
        line-height: 1.7;
        color: #475569;
      }

      .btn {
        display: inline-block;
        padding: 14px 24px;
        margin-top: 12px;
        background: linear-gradient(135deg, #0B6FBF, #002A5C);
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 700;
      }

      .btn-secondary {
        background: linear-gradient(135deg, #111827, #1f2937);
      }

      .steps {
        margin: 0 0 18px;
        padding-left: 20px;
      }
      .steps li {
        margin-bottom: 10px;
        font-size: 15px;
        line-height: 1.6;
        color: #475569;
      }
      .muted {
        font-size: 13px;
        color: #94a3b8;
      }
      .info-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 18px;
        margin: 24px 0;
      }

      .otp-box {
        display: inline-block;
        padding: 16px 24px;
        border-radius: 16px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        font-size: 32px;
        letter-spacing: 8px;
        font-weight: 800;
        color: #002A5C;
        margin: 16px 0;
      }

      .email-footer {
        padding: 24px;
        text-align: center;
        border-top: 1px solid #e5e7eb;
        background: #f8fafc;
      }

      .email-footer p {
        margin: 4px 0;
        font-size: 12px;
        color: #94a3b8;
      }

      .footer-links {
        margin-top: 10px;
      }

      .footer-links a {
        color: #64748b;
        text-decoration: none;
        margin: 0 8px;
        font-size: 12px;
      }

      @media only screen and (max-width: 640px) {
        body {
          padding: 12px;
        }

        .email-content {
          padding: 28px 20px;
        }

        h1 {
          font-size: 25px;
        }

        h2 {
          font-size: 21px;
        }

        .otp-box {
          font-size: 26px;
          letter-spacing: 5px;
          padding: 14px 18px;
        }

        .btn {
          display: block;
          text-align: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="email-wrapper">
      <div class="email-card">
        <!-- HEADER -->
        <div class="email-header">
          <img
            src="https://www.rooms4you.co.za/static/images/logo-reversed.png"
            alt="Rooms4You"
            class="logo"
          />
        </div>

        <!-- CONTENT -->
        <div class="email-content">{% block content %}{% endblock %}</div>

        <!-- FOOTER -->
        <div class="email-footer">
          <p>
            You're receiving this because you have an account on Rooms4You.
          </p>
          <p>
            &copy; {% now "Y" %} Rooms4You&trade;, owned and operated by 4You (Pty) Ltd.
          </p>
          <div class="footer-links">
            <a href="https://www.rooms4you.co.za/support/">Help Centre</a>
            <a href="https://www.rooms4you.co.za/trust/stay-safe/">Staying safe</a>
            <a href="https://www.rooms4you.co.za/pricing/">Pricing</a>
            <a href="https://www.rooms4you.co.za/privacy/">Privacy</a>
          </div>
          <div class="footer-links">
            <a href="https://instagram.com/rooms4youza">Instagram</a>
            <a href="https://facebook.com/rooms4youza">Facebook</a>
            <a href="https://x.com/rooms4youza">X</a>
            <a href="https://tiktok.com/@rooms4youza">TikTok</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
