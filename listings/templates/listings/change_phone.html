{% extends "listings/base.html" %} {% block content %}

<div class="form-card" style="max-width: 500px; margin: 40px auto">
  <h2 style="margin-bottom: 10px">Change Phone Number</h2>
  <p style="opacity: 0.8; margin-bottom: 20px">
    Enter your new number. We’ll send you a one-time code (OTP) to verify it.
  </p>

  <form method="POST">
    {% csrf_token %}
    <label>Country Code</label>
    <select name="country_code" class="input" required>
      <option value="+27">+27 🇿🇦</option>
      <option value="+1">+1 🇺🇸</option>
      <option value="+44">+44 🇬🇧</option>
    </select>

    <label style="margin-top: 12px">Phone Number</label>
    <input
      type="text"
      name="phone_number"
      class="input"
      placeholder="e.g. 712345678"
      required
    />

    <button type="submit" class="btn-primary" style="margin-top: 14px">
      Send OTP
    </button>
  </form>
</div>

{% endblock %}
