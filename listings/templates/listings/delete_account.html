{% extends "listings/base.html" %} {% block content %}

<div
  class="form-card"
  style="max-width: 500px; margin: 60px auto; text-align: center"
>
  <h2 style="color: red">Delete Account</h2>

  <p style="margin: 20px 0">
    This action is <strong>permanent</strong> and cannot be undone.
  </p>

  <p style="opacity: 0.7">
    All your data, listings, and profile will be removed.
  </p>

  <form method="POST" style="margin-top: 20px">
    {% csrf_token %}

    <button type="submit" class="btn-danger">Yes, delete my account</button>
  </form>

  <a
    href="{% url 'profile' %}"
    class="btn-secondary"
    style="margin-top: 12px; display: inline-block"
  >
    Cancel
  </a>
</div>

{% endblock %}
