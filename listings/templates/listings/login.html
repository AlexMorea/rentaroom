{% extends "listings/base.html" %} {% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h2 class="auth-title">Login</h2>

    <form method="post" class="auth-form">
      {% csrf_token %}

      <div class="field">
        <label class="auth-label">Email</label>
        <input
          class="input"
          type="email"
          name="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="field">
        <label class="auth-label">Password</label>
        <div class="pw-wrap">
          <input
            id="loginPassword"
            class="input pw-input"
            type="password"
            name="password"
            placeholder="Your password"
            required
          />
          <button
            class="pw-toggle"
            type="button"
            aria-label="Show password"
            data-toggle="#loginPassword"
          >
            👁
          </button>
        </div>
      </div>

      <button class="btn-primary auth-btn" type="submit">Login</button>
    </form>

    <p class="auth-hint" style="margin-top: 10px">
      <a class="auth-link" href="{% url 'password_reset' %}"
        >Forgot password?</a
      >
    </p>

    <p class="auth-hint">
      Don’t have an account?
      <a class="auth-link" href="{% url 'register' %}">Register</a>
    </p>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script>
  document.querySelectorAll("[data-toggle]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const sel = btn.getAttribute("data-toggle");
      const input = document.querySelector(sel);
      if (!input) return;

      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      btn.textContent = isHidden ? "🙈" : "👁";
      btn.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password",
      );
    });
  });
</script>
{% endblock %}
