{% extends "listings/base.html" %} {% block title %} Verify Account • Rooms4You
{% endblock %} {% block content %}

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Verify your account</h1>

    </div>

    <form method="POST" class="auth-form">
      {% csrf_token %}

      <div class="form-group">
        <label for="otp">Enter the OTP sent to your email address.</label>

        <input
          type="text"
          id="otp"
          name="otp"
          maxlength="6"
          required
          placeholder="Enter 6-digit OTP"
          class="input"
        />
      </div>

      <button type="submit" class="btn-primary auth-submit">
        Verify Account
      </button>
    </form>

    <div class="auth-footer">
      <button type="button" id="resend-btn" class="btn-secondary">
        <span id="resend-text">Resend OTP</span>
      </button>

      <div id="resend-message" aria-live="polite" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<script>
;(function () {
  const BTN_ID = "resend-btn";
  const TEXT_ID = "resend-text";
  const MSG_ID = "resend-message";
  const STORAGE_KEY = "otp_resend_until";
  const DEFAULT_COOLDOWN = 90;

  const btn = document.getElementById(BTN_ID);
  const txt = document.getElementById(TEXT_ID);
  const msg = document.getElementById(MSG_ID);

  function setMessage(text, level) {
    if (!msg) return;
    msg.textContent = text || "";
    msg.className = level ? `msg-${level}` : "";
  }

  function startCountdown(seconds) {
    const until = Date.now() + seconds * 1000;
    try {
      sessionStorage.setItem(STORAGE_KEY, String(until));
    } catch (e) {}

    updateCountdown();
  }

  function updateCountdown() {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) {
      enableButton();
      return;
    }

    const until = parseInt(raw, 10);
    const remaining = Math.max(0, Math.ceil((until - Date.now()) / 1000));

    if (remaining <= 0) {
      sessionStorage.removeItem(STORAGE_KEY);
      enableButton();
      return;
    }

    disableButton();
    if (txt) txt.textContent = `Resend in ${remaining}s`;

    setTimeout(updateCountdown, 1000);
  }

  function disableButton() {
    if (!btn) return;
    btn.disabled = true;
  }

  function enableButton() {
    if (!btn) return;
    btn.disabled = false;
    if (txt) txt.textContent = "Resend OTP";
  }

  async function handleResend() {
    if (!btn) return;
    disableButton();
    if (txt) txt.textContent = "Sending...";
    setMessage("");

    try {
      const res = await fetch("/resend-account-otp/");
      const data = await res.json().catch(() => ({}));

      const cooldown = (data && data.cooldown) || DEFAULT_COOLDOWN;

      if (res.ok) {
        setMessage(data.message || "OTP sent.", "success");
        startCountdown(cooldown);
        return;
      }

      if (res.status === 429) {
        setMessage(data.message || "Please wait before requesting another OTP.", "warning");
        startCountdown(cooldown);
        return;
      }

      setMessage(data.message || "Failed to resend OTP.", "error");
      enableButton();

    } catch (err) {
      setMessage("Failed to resend OTP.", "error");
      enableButton();
    }
  }

  // Attach click handler
  btn?.addEventListener("click", handleResend);

  // Initialize countdown on load
  updateCountdown();
})();
</script>

{% endblock %}
