{% extends "listings/base.html" %} {% block content %}

<div class="container" style="max-width: 900px; margin: 40px auto">
  <h1>🚚 Driver Dashboard</h1>
  <p>Welcome {{ driver.full_name }}</p>

  <div
    style="
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    "
  >
    <div class="form-card">
      <h3>Status</h3>
      <p>✅ Verified</p>
    </div>

    <div class="form-card">
      <h3>Vehicle</h3>
      <p>{{ driver.vehicle_type }}</p>
    </div>

    <div class="form-card">
      <h3>City</h3>
      <p>{{ driver.city }}</p>
    </div>
  </div>
</div>

{% endblock %}
