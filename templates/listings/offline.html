<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>You're Offline | Rooms4You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!--
    Deliberately self-contained: no CSS/JS files, no CDN fonts/icons, no
    logo image. This page is the service worker's last-resort fallback
    when a navigation fails offline - if it pulled in anything that
    wasn't already cached (e.g. the site's normal stylesheets), a
    cold/first-time offline visit would render broken and unstyled
    instead of this. Inline everything so it always renders correctly
    no matter what else is or isn't in the cache.
  -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
    }
    .offline-card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    .offline-icon { font-size: 52px; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    p { color: #475569; line-height: 1.6; margin: 0 0 20px; }
    button {
      appearance: none;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #0B6FBF, #002A5C);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 26px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>You're offline</h1>
    <p>
      It looks like you've lost your internet connection. Check your
      signal and try again - anything you already viewed recently may
      still be available.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
