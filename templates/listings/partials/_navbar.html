{% load static %}

<header class="site-header">
  <div class="nav-container">


<!-- LOGO -->
<div class="brand">

  <a href="{% url 'home' %}" class="navbar-logo">
    <img
      src="{% static 'images/logo.png' %}"
      alt="Rooms4You Logo"
    />
  </a>
  

</div>

<!-- NAVIGATION -->
<nav class="nav-links" id="navLinks">

  <a href="{% url 'room_list' %}">Rooms</a>

  <a href="{% url 'stays:guesthouse_list' %}">Guest Houses</a>

  <a href="{% url 'services' %}">
    Services
  </a>

  <a href="{% url 'about' %}">
    About Us
  </a>

  <a href="{% url 'trust:home' %}">
    Trust Center
  </a>

  <a href="{% url 'contact' %}">
    Contact
  </a>

  {% if user.is_authenticated %}

    {% if user.profile.role == "landlord" %}

      <a href="{% url 'dashboard' %}" class="dashboard-btn">
        Dashboard
      </a>

    {% endif %}

    <a href="{% url 'profile' %}">
      Profile
    </a>

    <a href="{% url 'account_settings' %}">
      Settings
    </a>

    <a
      href="#"
      onclick="
        event.preventDefault();
        document.getElementById('logout-form').submit();
      "
    >
      Logout
    </a>

    <form
      id="logout-form"
      method="POST"
      action="{% url 'logout' %}"
      class="hidden"
    >
      {% csrf_token %}
    </form>

  {% else %}

    <button
      id="authToggle"
      class="auth-avatar-btn"
      type="button"
    >
      <span>☰</span>
      <span class="avatar">👤</span>
    </button>

  {% endif %}

  <button
    id="themeToggle"
    class="theme-toggle-btn"
    type="button"
    aria-label="Switch to dark mode"
  >
    <span class="theme-toggle-icon theme-toggle-icon-dark">🌙</span>
    <span class="theme-toggle-icon theme-toggle-icon-light">☀️</span>
  </button>

</nav>

<!-- MOBILE BURGER -->
<button
  class="burger"
  id="burgerBtn"
  type="button"
  aria-label="Open menu"
  aria-expanded="false"
>
  <span class="burger-bar"></span>
  <span class="burger-bar"></span>
  <span class="burger-bar"></span>
</button>


  </div>
</header>

<div class="nav-backdrop" id="navBackdrop"></div>
